name: Register ZIP and publish
on:
  workflow_dispatch:
    inputs:
      release_url:
        description: '最新ZIPのURL（https://github.com/OWNER/REPOSITORY/releases/latest/download/CharacterA.zip）'
        required: true
        type: string
      display_name:
        description: '表示名（任意。新規登録はZIP名、登録済みなら現在の表示名）'
        required: false
        default: ''
        type: string
      category:
        description: '分類: characters=キャラクター / other=その他 / keep=変更なし（新規はキャラクター）'
        required: true
        default: keep
        type: choice
        options:
          - keep
          - characters
          - other

concurrency:
  group: publish-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # Registration always persists to the default branch, using its workflow.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch the current branch head after waiting for other publications.
          ref: ${{ github.event.repository.default_branch }}
      - name: Validate ZIP URL, register file and generate catalog
        run: python3 scripts/register.py
        env:
          # Inputs are data, never inserted into shell source.
          RELEASE_URL: ${{ inputs.release_url }}
          DISPLAY_NAME: ${{ inputs.display_name }}
          CATEGORY: ${{ inputs.category }}
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Save registration to the default branch
        env:
          PUBLISH_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- characters.json
          if ! git diff --cached --quiet -- characters.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Register release ZIP for publication" -- characters.json
          fi
          # No force-push: concurrent source edits stop publication for a retry.
          git push origin "HEAD:refs/heads/$PUBLISH_BRANCH"
      - name: Publish static files
        id: deployment
        uses: actions/deploy-pages@v4
